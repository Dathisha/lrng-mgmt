<div class="lms-page-wrapper">
  <div class="container-fluid px-3 px-md-4 py-4 max-width-container">

    <!-- Toast Notification -->
    <div *ngIf="toastMessage" class="toast-notification fade show shadow-lg mb-4" role="alert">
      <i class="bi me-2 fs-5" [ngClass]="toastType === 'success' ? 'bi-check-circle-fill text-success' : 'bi-exclamation-triangle-fill text-danger'"></i>
      <span>{{ toastMessage }}</span>
      <button type="button" class="btn-close ms-auto" (click)="toastMessage = null"></button>
    </div>

    <!-- Top Header -->
    <div class="lms-page-header">
      <div>
        <h1 class="page-title">{{ pageTitle }}</h1>
        <p class="page-subtitle">Fill in class slot parameters, assigned faculty, room number and timing</p>
      </div>
      <div>
        <button type="button" class="btn btn-outline-secondary rounded-3 px-3 py-2 fw-semibold d-flex align-items-center gap-1 shadow-sm" (click)="cancel()">
          <i class="bi bi-arrow-left"></i> Back to Timetable List
        </button>
      </div>
    </div>

    <form [formGroup]="timetableForm" class="row g-4">
      <!-- Left Column: Primary Details -->
      <div class="col-12 col-lg-8">

        <!-- Section 1: Subject & Faculty Details -->
        <div class="ref-content-card p-4 mb-4">
          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
            <i class="bi bi-journal-bookmark-fill text-warning me-2"></i> Lecture & Subject Information
          </h5>

          <div class="row g-3">
            <!-- Subject Name -->
            <div class="col-12 col-md-8">
              <label class="form-label-custom">SUBJECT NAME *</label>
              <input
                type="text"
                class="form-control custom-input"
                [ngClass]="{ 'is-invalid': submitted && f['subject'].errors }"
                placeholder="e.g. Data Structures & Algorithms"
                formControlName="subject"
              />
              <div *ngIf="submitted && f['subject'].errors" class="invalid-feedback">
                <span *ngIf="f['subject'].errors['required']">Subject name is required.</span>
                <span *ngIf="f['subject'].errors['minlength']">Must be at least 3 characters.</span>
              </div>
            </div>

            <!-- Subject Code -->
            <div class="col-12 col-md-4">
              <label class="form-label-custom">SUBJECT CODE *</label>
              <input
                type="text"
                class="form-control custom-input"
                [ngClass]="{ 'is-invalid': submitted && f['subjectCode'].errors }"
                placeholder="e.g. CS701"
                formControlName="subjectCode"
              />
              <div *ngIf="submitted && f['subjectCode'].errors" class="invalid-feedback">
                <span *ngIf="f['subjectCode'].errors['required']">Subject code is required.</span>
              </div>
            </div>

            <!-- Faculty Name -->
            <div class="col-12">
              <label class="form-label-custom">FACULTY IN-CHARGE *</label>
              <input
                type="text"
                class="form-control custom-input"
                [ngClass]="{ 'is-invalid': submitted && f['faculty'].errors }"
                placeholder="e.g. Dr. Ramesh Kumar"
                formControlName="faculty"
              />
              <div *ngIf="submitted && f['faculty'].errors" class="invalid-feedback">
                <span *ngIf="f['faculty'].errors['required']">Faculty name is required.</span>
              </div>
            </div>

            <!-- Visual Color Tag -->
            <div class="col-12">
              <label class="form-label-custom">SUBJECT CARD COLOR TAG</label>
              <div class="d-flex gap-3 align-items-center">
                <label class="cursor-pointer">
                  <input type="radio" formControlName="colorTag" value="blue" class="d-none">
                  <span class="color-badge-picker bg-blue-picker" [class.selected]="f['colorTag'].value === 'blue'"></span>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" formControlName="colorTag" value="cyan" class="d-none">
                  <span class="color-badge-picker bg-cyan-picker" [class.selected]="f['colorTag'].value === 'cyan'"></span>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" formControlName="colorTag" value="pink" class="d-none">
                  <span class="color-badge-picker bg-pink-picker" [class.selected]="f['colorTag'].value === 'pink'"></span>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" formControlName="colorTag" value="green" class="d-none">
                  <span class="color-badge-picker bg-green-picker" [class.selected]="f['colorTag'].value === 'green'"></span>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" formControlName="colorTag" value="purple" class="d-none">
                  <span class="color-badge-picker bg-purple-picker" [class.selected]="f['colorTag'].value === 'purple'"></span>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" formControlName="colorTag" value="amber" class="d-none">
                  <span class="color-badge-picker bg-amber-picker" [class.selected]="f['colorTag'].value === 'amber'"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 2: Timing & Period Allocation -->
        <div class="ref-content-card p-4 mb-4">
          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
            <i class="bi bi-clock-history text-warning me-2"></i> Day & Time Period Allocation
          </h5>

          <div class="row g-3">
            <!-- Day -->
            <div class="col-12 col-md-4">
              <label class="form-label-custom">DAY OF WEEK *</label>
              <select class="form-select custom-select" formControlName="day">
                <option *ngFor="let d of days" [value]="d">{{ d }}</option>
              </select>
            </div>

            <!-- Period Number -->
            <div class="col-12 col-md-4">
              <label class="form-label-custom">PERIOD NUMBER *</label>
              <select class="form-select custom-select" formControlName="periodNumber">
                <ng-container *ngFor="let slot of timeSlots">
                  <option *ngIf="!slot.isBreak" [value]="slot.periodNumber">
                    Period {{ slot.periodNumber }} ({{ slot.label }})
                  </option>
                </ng-container>
              </select>
            </div>

            <!-- Start Time -->
            <div class="col-12 col-md-4">
              <label class="form-label-custom">START TIME *</label>
              <input type="text" class="form-control custom-input" formControlName="startTime" placeholder="09:00 AM" />
            </div>

            <!-- End Time -->
            <div class="col-12 col-md-4">
              <label class="form-label-custom">END TIME *</label>
              <input type="text" class="form-control custom-input" formControlName="endTime" placeholder="10:00 AM" />
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column: Academic Scope & Actions -->
      <div class="col-12 col-lg-4">
        <!-- Academic Scope Card -->
        <div class="ref-content-card p-4 mb-4">
          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
            <i class="bi bi-building text-warning me-2"></i> Academic Scope
          </h5>

          <!-- Department -->
          <div class="mb-3">
            <label class="form-label-custom">DEPARTMENT *</label>
            <select class="form-select custom-select" formControlName="department">
              <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
            </select>
          </div>

          <!-- Course -->
          <div class="mb-3">
            <label class="form-label-custom">COURSE / DEGREE *</label>
            <select class="form-select custom-select" formControlName="course">
              <option *ngFor="let crs of courses" [value]="crs">{{ crs }}</option>
            </select>
          </div>

          <!-- Year -->
          <div class="mb-3">
            <label class="form-label-custom">ACADEMIC YEAR LEVEL *</label>
            <select class="form-select custom-select" formControlName="year">
              <option *ngFor="let yr of years" [value]="yr">{{ yr }}</option>
            </select>
          </div>

          <!-- Semester -->
          <div class="mb-3">
            <label class="form-label-custom">SEMESTER *</label>
            <select class="form-select custom-select" formControlName="semester">
              <option *ngFor="let sem of semesters" [value]="sem">{{ sem }}</option>
            </select>
          </div>

          <!-- Section -->
          <div class="mb-3">
            <label class="form-label-custom">SECTION <span class="text-muted x-small">(Optional)</span></label>
            <select class="form-select custom-select" formControlName="section">
              <option value="">Select Section (Optional)</option>
              <option *ngFor="let sec of sections" [value]="sec">{{ sec }}</option>
            </select>
          </div>

          <!-- Academic Session -->
          <div class="mb-4">
            <label class="form-label-custom">ACADEMIC SESSION *</label>
            <select class="form-select custom-select" formControlName="academicYear">
              <option *ngFor="let ay of academicYears" [value]="ay">{{ ay }}</option>
            </select>
          </div>

          <!-- Action Buttons -->
          <div class="d-grid gap-2 pt-2 border-top">
            <button
              type="button"
              class="btn-amber-primary w-100 justify-content-center py-2.5"
              (click)="saveEntry(false)"
            >
              <i class="bi bi-check-circle-fill"></i> {{ isEditMode ? 'Update Timetable Entry' : 'Save Timetable Entry' }}
            </button>

            <button
              *ngIf="!isEditMode"
              type="button"
              class="btn btn-outline-secondary py-2.5 fw-bold rounded-3"
              (click)="saveEntry(true)"
            >
              <i class="bi bi-plus-circle-fill me-1"></i> Save & Add Another
            </button>

            <button
              type="button"
              class="btn btn-light py-2 text-muted fw-semibold"
              (click)="resetForm()"
            >
              Reset Form
            </button>

            <button type="button" class="btn btn-link text-muted py-1 x-small text-decoration-none fw-semibold" (click)="cancel()">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </form>

  </div>
</div>
